<text x="110" y="405" fill="#FAF9F4" font-family="Georgia, serif" font-size="100">INFRASTRUCTURE</text>
<text x="110" y="485" fill="#FAF9F4" opacity=".68" font-family="Arial, Helvetica, sans-serif" font-size="29">CRM, automation, integrations, and the operational logic underneath it all.</text>
<path d="M110 605 H1490" stroke="#FAF9F4" opacity=".13"/>
<text x="110" y="676" fill="#8DA5B7" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">MODULAR BY DESIGN</text>
<text x="110" y="735" fill="#FAF9F4" font-family="Georgia, serif" font-size="42">One layer. Selected layers. Or the whole machine.</text>
<text x="110" y="798" fill="#FAF9F4" opacity=".58" font-family="Arial, Helvetica, sans-serif" font-size="23">Start with the problem in front of you. Combine what needs to work together.</text>
<text x="110" y="838" fill="#FAF9F4" opacity=".58" font-family="Arial, Helvetica, sans-serif" font-size="23">Connect all four when the business needs one integrated system.</text>

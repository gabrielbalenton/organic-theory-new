<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">B2B timber merchant rebuild</title>
<desc id="desc">Migration from a page-builder website to a custom Next.js production stack with performance, search, analytics and security layers.</desc>
<rect width="1600" height="1000" fill="#FAF9F4"/>
<rect x="90" y="90" width="1420" height="820" rx="36" fill="#E8E2DB" stroke="#2F3A45" stroke-opacity=".12" stroke-width="2"/>
<text x="150" y="180" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#2F3A45">WEBSITE REBUILD + MIGRATION</text>
<text x="150" y="225" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2F3A45" opacity=".58">Page-builder constraints replaced with a controllable production system.</text>
<rect x="150" y="330" width="350" height="300" rx="28" fill="#FAF9F4" stroke="#2F3A45" stroke-opacity=".15"/>
<text x="195" y="390" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2F3A45">LEGACY</text>
<text x="195" y="435" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2F3A45" opacity=".62">Page builder</text>
<text x="195" y="475" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2F3A45" opacity=".62">Shallow product discovery</text>
<text x="195" y="515" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2F3A45" opacity=".62">Limited redirect control</text>
<text x="195" y="555" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2F3A45" opacity=".62">Restricted performance tuning</text>
<path d="M540 480 H720" stroke="#8DA5B7" stroke-width="8" stroke-linecap="round"/>
<path d="M690 450 L730 480 L690 510" fill="none" stroke="#8DA5B7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="780" y="285" width="670" height="390" rx="28" fill="#2F3A45"/>
<text x="835" y="350" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FAF9F4">CUSTOM PRODUCTION STACK</text>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#FAF9F4" opacity=".8">
<text x="835" y="410">Next.js 16 · React 19 · TypeScript</text>
<text x="835" y="455">Static-first rendering · server-side forms</text>
<text x="835" y="500">Route-scoped CSS · AVIF/WebP</text>
<text x="835" y="545">301 redirects · security headers</text>
<text x="835" y="590">GA4 · Search Console · JSON-LD</text>
</g>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<rect x="230" y="745" width="250" height="92" rx="20" fill="#FAF9F4" stroke="#2F3A45" stroke-opacity=".12"/><text x="355" y="785" font-size="30" font-weight="700" fill="#2F3A45">100</text><text x="355" y="815" font-size="13" fill="#2F3A45" opacity=".58">PERFORMANCE</text>
<rect x="555" y="745" width="250" height="92" rx="20" fill="#FAF9F4" stroke="#2F3A45" stroke-opacity=".12"/><text x="680" y="785" font-size="30" font-weight="700" fill="#2F3A45">100</text><text x="680" y="815" font-size="13" fill="#2F3A45" opacity=".58">ACCESSIBILITY</text>
<rect x="880" y="745" width="250" height="92" rx="20" fill="#FAF9F4" stroke="#2F3A45" stroke-opacity=".12"/><text x="1005" y="785" font-size="30" font-weight="700" fill="#2F3A45">100</text><text x="1005" y="815" font-size="13" fill="#2F3A45" opacity=".58">BEST PRACTICES</text>
<rect x="1205" y="745" width="250" height="92" rx="20" fill="#FAF9F4" stroke="#2F3A45" stroke-opacity=".12"/><text x="1330" y="785" font-size="30" font-weight="700" fill="#2F3A45">100</text><text x="1330" y="815" font-size="13" fill="#2F3A45" opacity=".58">SEO</text>

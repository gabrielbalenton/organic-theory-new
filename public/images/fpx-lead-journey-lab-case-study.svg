<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Illustrated process canvas for an AI-assisted journey lab</title>
<desc id="desc">A conceptual, non-sensitive view of a visual workflow editor featuring connected activity cards, workshop review states, and a structured decision panel.</desc>
<defs>
  <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#2F3A45" stroke-opacity=".045"/></pattern>
  <linearGradient id="desk" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#FAF9F4"/><stop offset="1" stop-color="#E8E2DB"/></linearGradient>
  <filter id="shadow" x="-20%" y="-30%" width="145%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2F3A45" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8FA897"/></marker>
</defs>
<rect width="1600" height="1000" fill="url(#desk)"/>
<circle cx="1425" cy="65" r="365" fill="#8DA5B7" opacity=".075"/>
<circle cx="80" cy="940" r="300" fill="#8FA897" opacity=".095"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Local SEO case study</title><desc id="desc">Search growth metrics for an Australian building design company.</desc>
<rect width="1600" height="1000" fill="#050505"/><rect x="90" y="90" width="1420" height="820" rx="36" fill="#0D100D"/>
<text x="150" y="180" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#F5F7F5">SEO + LOCAL SEO</text>
<text x="150" y="225" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#929A94">1,281 suburb pages mapped to local search intent across New South Wales.</text>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<rect x="150" y="330" width="280" height="150" rx="24" fill="#050505"/><text x="290" y="392" font-size="36" font-weight="700" fill="#7CFF6B">+53%</text><text x="290" y="432" font-size="13" fill="#929A94">SEARCH CLICKS</text>
<rect x="490" y="330" width="280" height="150" rx="24" fill="#050505"/><text x="630" y="392" font-size="36" font-weight="700" fill="#7CFF6B">+154%</text><text x="630" y="432" font-size="13" fill="#929A94">IMPRESSIONS</text>
<rect x="830" y="330" width="280" height="150" rx="24" fill="#050505"/><text x="970" y="392" font-size="36" font-weight="700" fill="#7CFF6B">1,281</text><text x="970" y="432" font-size="13" fill="#929A94">LOCAL PAGES</text>
<rect x="1170" y="330" width="280" height="150" rx="24" fill="#F5F7F5"/><text x="1310" y="392" font-size="36" font-weight="700" fill="#050505">63.21%</text><text x="1310" y="432" font-size="13" fill="#C9D0CA">SEARCH VISIBILITY</text>
</g>
<g font-family="Arial,Helvetica,sans-serif">
<text x="180" y="620" font-size="18" font-weight="700" fill="#F5F7F5">KEYWORD DISTRIBUTION</text>
<rect x="350" y="665" width="780" height="38" rx="10" fill="#7CFF6B"/><text x="1150" y="692" font-size="18" fill="#F5F7F5">189 in positions 1–3</text>
<rect x="350" y="730" width="300" height="38" rx="10" fill="#58C950"/><text x="670" y="757" font-size="18" fill="#F5F7F5">44 in positions 4–10</text>
<rect x="350" y="795" width="245" height="38" rx="10" fill="#2D6E2A"/><text x="615" y="822" font-size="18" fill="#F5F7F5">36 in positions 11–20</text>
</g></svg>
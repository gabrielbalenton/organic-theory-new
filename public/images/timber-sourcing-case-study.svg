<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">B2B timber sourcing acquisition architecture</title>
<desc id="desc">A public marketing layer leading to sourcing routes and an authenticated application, with performance results shown below.</desc>
<rect width="1600" height="1000" fill="#FAF9F4"/>
<rect x="90" y="90" width="1420" height="820" rx="36" fill="#E8E2DB" stroke="#2F3A45" stroke-opacity=".12" stroke-width="2"/>
<text x="150" y="180" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#2F3A45">PUBLIC ACQUISITION → PRODUCT</text>
<text x="150" y="225" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2F3A45" opacity=".58">Explain and qualify publicly. Transact inside the authenticated application.</text>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="150" y="340" width="330" height="230" rx="26" fill="#FAF9F4" stroke="#2F3A45" stroke-opacity=".15"/>
<text x="190" y="400" font-size="22" font-weight="700" fill="#2F3A45">Marketing Site</text>
<text x="190" y="445" font-size="17" fill="#2F3A45" opacity=".58">Positioning</text>
<text x="190" y="480" font-size="17" fill="#2F3A45" opacity=".58">Timber range</text>
<text x="190" y="515" font-size="17" fill="#2F3A45" opacity=".58">Proof + education</text>
<rect x="635" y="340" width="330" height="230" rx="26" fill="#FAF9F4" stroke="#2F3A45" stroke-opacity=".15"/>
<text x="675" y="400" font-size="22" font-weight="700" fill="#2F3A45">Sourcing Routes</text>
<text x="675" y="445" font-size="17" fill="#2F3A45" opacity=".58">Browse inventory</text>
<text x="675" y="480" font-size="17" fill="#2F3A45" opacity=".58">Review offers</text>
<text x="675" y="515" font-size="17" fill="#2F3A45" opacity=".58">Create request</text>
<rect x="1120" y="340" width="330" height="230" rx="26" fill="#2F3A45"/>
<text x="1160" y="400" font-size="22" font-weight="700" fill="#FAF9F4">Authenticated App</text>
<text x="1160" y="445" font-size="17" fill="#FAF9F4" opacity=".72">Current supply</text>
<text x="1160" y="480" font-size="17" fill="#FAF9F4" opacity=".72">Requests + offers</text>
<text x="1160" y="515" font-size="17" fill="#FAF9F4" opacity=".72">Account workflows</text>
</g>
<g stroke="#8FA897" stroke-width="7" fill="none" stroke-linecap="round">
<path d="M480 455 H635"/><path d="M965 455 H1120"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<rect x="280" y="700" width="430" height="120" rx="24" fill="#FAF9F4" stroke="#2F3A45" stroke-opacity=".12"/>
<text x="495" y="755" font-size="34" font-weight="700" fill="#2F3A45">79 → 98</text>
<text x="495" y="792" font-size="14" fill="#2F3A45" opacity=".58">MOBILE PERFORMANCE</text>
<rect x="890" y="700" width="430" height="120" rx="24" fill="#FAF9F4" stroke="#2F3A45" stroke-opacity=".12"/>
<text x="1105" y="755" font-size="34" font-weight="700" fill="#2F3A45">95 → 99</text>
<text x="1105" y="792" font-size="14" fill="#2F3A45" opacity=".58">DESKTOP PERFORMANCE</text>
</g>
</svg>